[project]
name = "hakimifr-lyrics-sync"
version = "0.0.12"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "rich>=15.0.0",
]

[tool.pyright]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportUnusedParameter = false

[project.scripts]
lsync = "hakimifr_lyrics_sync.__main__:run"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
